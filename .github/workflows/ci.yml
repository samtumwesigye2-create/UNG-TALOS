name: TALOS Phase 1 CI

on:
  push:
    branches: [main, feature/phase1-reconstruction]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 'uvicorn[standard]==0.30.6' requests==2.32.3 httpx pytest
      - name: Run tests
        run: python -m pytest -q
